name: noor_quran_companion
description: Full-featured offline-ready Quran, Tafsir, Audio, Prayer Times, Qibla, Hifz, and Azkar app.
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.1
  shared_preferences: ^2.2.3
  just_audio: ^0.9.38
  audio_session: ^0.1.19
  geolocator: ^12.0.0
  flutter_compass: ^0.8.0
  flutter_local_notifications: ^18.0.1
  wakelock_plus: ^1.2.5
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#0B8457"
  adaptive_icon_foreground: "assets/images/app_icon.png"

flutter_native_splash:
  color: "#041A15"
  color_dark: "#041A15"
  image: "assets/images/app_icon.png"
  android_12:
    color: "#041A15"
    icon_background_color: "#0B8457"
    image: "assets/images/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/images/
    - assets/offline_pack/
  fonts:
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf
