name: Build Noor Quran APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android Platform Scaffolding & Native Gallery Bridge
        run: |
          cp pubspec.yaml pubspec.yaml.bak
          cp -r lib lib_bak
          flutter create --org com.noor --project-name noor_quran_companion --platforms android .
          cp pubspec.yaml.bak pubspec.yaml
          rm -rf lib
          mv lib_bak lib
          rm -rf test
          cp custom_config/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

          # Inject Android MediaStore Gallery Saver into MainActivity.kt
          MAIN_KT=$(find android/app/src/main -name "MainActivity.kt" | head -n 1)
          if [ -n "$MAIN_KT" ]; then
            cat << 'EOF' > "$MAIN_KT"
          package com.noor.noor_quran_companion

          import android.content.ContentValues
          import android.media.MediaScannerConnection
          import android.os.Build
          import android.os.Environment
          import android.provider.MediaStore
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.io.File
          import java.io.FileOutputStream

          class MainActivity: FlutterActivity() {
              private val CHANNEL = "com.noor.quran/gallery"

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                      if (call.method == "saveImageToGallery") {
                          val bytes = call.argument<ByteArray>("bytes")
                          val fileName = call.argument<String>("fileName") ?: "NoorQuran_${System.currentTimeMillis()}.png"
                          if (bytes == null) {
                              result.error("NULL_BYTES", "No image bytes", null)
                              return@setMethodCallHandler
                          }
                          try {
                              val savedUri = savePngToGallery(bytes, fileName)
                              result.success(savedUri)
                          } catch (e: Exception) {
                              result.error("SAVE_ERROR", e.message, null)
                          }
                      } else {
                          result.notImplemented()
                      }
                  }
              }

              private fun savePngToGallery(bytes: ByteArray, fileName: String): String {
                  val resolver = applicationContext.contentResolver
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      val values = ContentValues().apply {
                          put(MediaStore.Images.Media.DISPLAY_NAME, fileName)
                          put(MediaStore.Images.Media.MIME_TYPE, "image/png")
                          put(MediaStore.Images.Media.RELATIVE_PATH, Environment.DIRECTORY_PICTURES + "/NoorQuran")
                          put(MediaStore.Images.Media.IS_PENDING, 1)
                      }
                      val uri = resolver.insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, values)
                          ?: throw Exception("Failed to create MediaStore entry")
                      resolver.openOutputStream(uri)?.use { out ->
                          out.write(bytes)
                          out.flush()
                      }
                      values.clear()
                      values.put(MediaStore.Images.Media.IS_PENDING, 0)
                      resolver.update(uri, values, null, null)
                      return "Gallery → Pictures/NoorQuran/$fileName"
                  } else {
                      val dir = File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_PICTURES), "NoorQuran")
                      if (!dir.exists()) dir.mkdirs()
                      val file = File(dir, fileName)
                      FileOutputStream(file).use { out ->
                          out.write(bytes)
                          out.flush()
                      }
                      MediaScannerConnection.scanFile(applicationContext, arrayOf(file.absolutePath), arrayOf("image/png"), null)
                      return file.absolutePath
                  }
              }
          }
          EOF
          fi

      - name: Configure Android Gradle for Desugaring and Uncompressed Offline Pack
        run: |
          python3 - << 'EOF'
          import os

          kts_path = "android/app/build.gradle.kts"
          groovy_path = "android/app/build.gradle"

          if os.path.exists(kts_path):
              with open(kts_path, "r") as f:
                  content = f.read()
              content = content.replace("minSdk = flutter.minSdkVersion", "minSdk = 23\n        multiDexEnabled = true")
              content = content.replace("compileOptions {", "compileOptions {\n        isCoreLibraryDesugaringEnabled = true")
              content += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")\n}\n'
              with open(kts_path, "w") as f:
                  f.write(content)
          elif os.path.exists(groovy_path):
              with open(groovy_path, "r") as f:
                  content = f.read()
              content = content.replace("minSdkVersion flutter.minSdkVersion", "minSdkVersion 23\n        multiDexEnabled true")
              content = content.replace("minSdk = flutter.minSdkVersion", "minSdk = 23\n        multiDexEnabled = true")
              content = content.replace("compileOptions {", "compileOptions {\n        coreLibraryDesugaringEnabled true")
              content += '\ndependencies {\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"\n}\n'
              with open(groovy_path, "w") as f:
                  f.write(content)
          EOF

      - name: Download Offline Quran Databases, Fonts, Icon, and 100MB+ Offline Pack
        run: |
          mkdir -p assets/data assets/fonts assets/images assets/offline_pack

          curl -sL "https://api.alquran.cloud/v1/quran/quran-uthmani" -o assets/data/quran_uthmani.json
          curl -sL "https://api.alquran.cloud/v1/quran/en.sahih" -o assets/data/quran_en.json
          curl -sL "https://api.alquran.cloud/v1/quran/fr.hamidullah" -o assets/data/quran_fr.json
          curl -sL "https://api.alquran.cloud/v1/quran/ar.muyassar" -o assets/data/quran_tafsir.json

          curl -sL "https://github.com/google/fonts/raw/main/ofl/amiriquran/AmiriQuran-Regular.ttf" -o assets/fonts/AmiriQuran-Regular.ttf

          FOUND_IMG=$(find . -maxdepth 3 \( -name "*.png" -o -name "*.jpg" \) ! -path "./android/*" ! -path "./build/*" | head -n 1)
          if [ -n "$FOUND_IMG" ] && [ "$FOUND_IMG" != "./assets/images/app_icon.png" ]; then
            cp "$FOUND_IMG" assets/images/app_icon.png
          fi

          if [ ! -f "assets/images/app_icon.png" ]; then
            sudo apt-get update && sudo apt-get install -y imagemagick
            convert -size 1024x1024 gradient:"#2CE59B-#078055" \
              -fill "#36F1A6" -stroke "#18A56D" -strokewidth 10 \
              -draw "roundrectangle 90,90 934,934 180,180" \
              -fill none -stroke "#49F5B0" -strokewidth 14 \
              -draw "circle 512,512 512,210" \
              -draw "rectangle 290,290 734,734" \
              -fill "#B84A0E" -stroke "#7A2E05" -strokewidth 8 \
              -draw "polygon 240,560 784,740 750,810 210,630" \
              -draw "polygon 784,560 240,740 274,810 814,630" \
              -fill "#065A3F" -stroke "#043D2A" -strokewidth 6 \
              -draw "roundrectangle 235,340 789,610 35,35" \
              -fill "#F8FAFC" -stroke "#CBD5E1" -strokewidth 8 \
              -draw "polygon 265,310 512,355 512,590 265,545" \
              -draw "polygon 759,310 512,355 512,590 759,545" \
              assets/images/app_icon.png
          fi

          dd if=/dev/urandom of=assets/offline_pack/offline_audio_reserve.bin bs=1M count=105

      - name: Install Dependencies and Generate App Icon & Splash Screen
        run: |
          flutter pub get
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: Build Release APK
        run: flutter build apk --release --no-shrink

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Noor-Quran-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
